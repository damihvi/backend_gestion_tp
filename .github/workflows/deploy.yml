name: Deploy Backend to VM

on:
  push:
    branches:
      - master  # 👈 Cambio aquí
    paths:
      - '**/*.py'
      - 'requirements.txt'
      - 'transporte_config/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            # Agregar como directorio seguro
            git config --global --add safe.directory /opt/gestion_transporte/backend_gestion_tp
            
            # Ir al directorio del backend
            cd /opt/gestion_transporte/backend_gestion_tp
            
            # Activar entorno virtual
            source /opt/gestion_transporte/venv/bin/activate
            
            # Hacer pull del código (master, no main)
            git pull origin master
            
            # Instalar dependencias
            pip install -r requirements.txt
            
            # Ejecutar migraciones
            python manage.py migrate --noinput
            
            # Recolectar archivos estáticos
            python manage.py collectstatic --noinput
            
            # Reiniciar Gunicorn
            sudo systemctl restart gunicorn
            
            # Verificar estado
            sudo systemctl status gunicorn --no-pager
